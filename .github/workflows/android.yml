name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk gs-note.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gs-note-apk
          path: gs-note.apk
      # Each push to main publishes a release with the APK attached, so it can be
      # downloaded straight from a phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/gs-note.apk
      # Only publish when the APK is signed with the fixed release key; a
      # debug-signed APK could not be installed as an update.
      - name: Check release signing key
        id: signing
        run: echo "ready=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 메모 앱 빌드 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            갤럭시에서 아래 `gs-note.apk`를 눌러 내려받고 설치하세요.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
          files: gs-note.apk
