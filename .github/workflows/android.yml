name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk gs-note.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gs-note-apk
          path: gs-note.apk
      # Each push publishes a release with the APK attached, so it can be
      # downloaded straight from a phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/gs-note.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 메모 앱 빌드 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            갤럭시에서 아래 `gs-note.apk`를 눌러 내려받고 설치하세요.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
          files: gs-note.apk
